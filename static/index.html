<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Analyzer</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --border:   #30363d;
    --text:     #c9d1d9;
    --muted:    #8b949e;
    --accent:   #58a6ff;
    --green:    #3fb950;
    --yellow:   #d29922;
    --red:      #f85149;
    --purple:   #bc8cff;
    --radius:   8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  header h1 span { color: var(--accent); }

  .api-key-wrap { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 520px; margin-left: auto; }
  .api-key-wrap label { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .api-key-wrap input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius); padding: 6px 10px; font-size: 13px;
  }
  .api-key-wrap input:focus { outline: none; border-color: var(--accent); }

  /* ── Layout ── */
  .container { max-width: 1100px; margin: 0 auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; }

  /* ── Cards / Steps ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: #1c2128;
  }
  .step-badge {
    background: var(--accent); color: #000; border-radius: 50%;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .card-header h2 { font-size: 14px; font-weight: 600; }
  .card-body { padding: 18px; }

  /* ── Form elements ── */
  textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius); padding: 10px 12px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px; resize: vertical; min-height: 90px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .row { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; }

  button {
    background: var(--accent); color: #000; border: none; border-radius: var(--radius);
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    white-space: nowrap; transition: opacity 0.15s;
  }
  button:hover:not(:disabled) { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary {
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
  }
  button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }

  /* ── Log ── */
  .log {
    margin-top: 12px; font-family: monospace; font-size: 12px;
    color: var(--muted); display: flex; flex-direction: column; gap: 2px;
    max-height: 120px; overflow-y: auto;
  }
  .log .ok   { color: var(--green); }
  .log .err  { color: var(--red); }
  .log .info { color: var(--muted); }

  /* ── File list ── */
  .file-list { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .file-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 10px; cursor: pointer; user-select: none;
    font-size: 12px; transition: border-color 0.15s;
  }
  .file-chip:hover { border-color: var(--accent); }
  .file-chip.selected { border-color: var(--accent); background: rgba(88,166,255,.08); color: var(--accent); }
  .file-chip input[type=checkbox] { display: none; }
  .file-chip .chip-delete {
    color: var(--muted); background: none; border: none; padding: 0 0 0 4px;
    cursor: pointer; font-size: 13px; line-height: 1;
  }
  .file-chip .chip-delete:hover { color: var(--red); }
  .file-count { color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* ── Phase indicator ── */
  .phase-bar {
    display: flex; gap: 6px; margin-bottom: 14px;
  }
  .phase-pill {
    padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); color: var(--muted); background: var(--bg);
    transition: all 0.2s;
  }
  .phase-pill.active  { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,.1); }
  .phase-pill.done    { border-color: var(--green);  color: var(--green);  background: rgba(63,185,80,.08); }

  /* ── Analysis output ── */
  .analysis-panel {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; max-height: 500px; overflow-y: auto;
    font-size: 14px; line-height: 1.7;
  }
  .analysis-panel:empty::after { content: "Analysis will stream here…"; color: var(--muted); }
  .analysis-panel.streaming::after { content: " ▌"; animation: blink .6s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Markdown rendering */
  .analysis-panel h1 { font-size: 18px; margin: 16px 0 8px; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .analysis-panel h2 { font-size: 15px; margin: 14px 0 6px; color: var(--accent); }
  .analysis-panel h3 { font-size: 13px; margin: 10px 0 4px; color: var(--purple); }
  .analysis-panel p  { margin-bottom: 8px; }
  .analysis-panel ul, .analysis-panel ol { padding-left: 20px; margin-bottom: 8px; }
  .analysis-panel li { margin-bottom: 2px; }
  .analysis-panel strong { color: #fff; }
  .analysis-panel code { background: #2a2a2a; padding: 2px 5px; border-radius: 4px; font-size: 12px; }
  .analysis-panel pre { background: #2a2a2a; padding: 12px; border-radius: 6px; overflow-x: auto; margin-bottom: 8px; }
  .analysis-panel blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--muted); margin-bottom: 8px; }
  .analysis-panel hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  /* ── Profile card ── */
  .profile-card {
    margin-top: 18px; background: var(--bg);
    border: 1px solid var(--green); border-radius: var(--radius);
    padding: 16px;
  }
  .profile-card h3 { color: var(--green); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
  .profile-name { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .profile-summary { color: var(--muted); font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  .signal-group { margin-bottom: 12px; }
  .signal-group-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 5px; }
  .signal-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .signal-tag {
    font-size: 11px; padding: 3px 8px; border-radius: 12px; border: 1px solid;
  }
  .signal-tag.must     { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,.08); }
  .signal-tag.strong   { border-color: var(--green);  color: var(--green);  background: rgba(63,185,80,.08); }
  .signal-tag.disqual  { border-color: var(--red);    color: var(--red);    background: rgba(248,81,73,.08); }
  .signal-tag.channel  { border-color: var(--purple); color: var(--purple); background: rgba(188,140,255,.08); }

  /* ── Scores ── */
  .score-table { margin-top: 14px; width: 100%; border-collapse: collapse; }
  .score-table th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--border);
  }
  .score-table td { padding: 10px 10px; border-bottom: 1px solid #1e2430; vertical-align: top; }
  .score-table tr:last-child td { border-bottom: none; }

  .score-badge {
    font-size: 18px; font-weight: 700; width: 50px; text-align: center;
    border-radius: 6px; padding: 4px 6px;
  }
  .score-badge.high   { color: var(--green);  background: rgba(63,185,80,.12); }
  .score-badge.medium { color: var(--yellow); background: rgba(210,153,34,.12); }
  .score-badge.low    { color: var(--red);    background: rgba(248,81,73,.12); }

  .verdict { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .verdict.strong   { color: var(--green); }
  .verdict.moderate { color: var(--yellow); }
  .verdict.weak     { color: var(--red); }

  .similarities { margin-top: 4px; }
  .similarities li { font-size: 12px; color: var(--muted); }

  /* ── Spinner ── */
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(88,166,255,.3); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Utility ── */
  .hidden { display: none !important; }
  .mt8 { margin-top: 8px; }
</style>
</head>
<body>

<header>
  <h1>🔍 <span>HTML</span> Analyzer</h1>
  <div class="api-key-wrap">
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="sk-ant-… (or set ANTHROPIC_API_KEY env var)">
  </div>
</header>

<div class="container">

  <!-- ── STEP 1: EXTRACT ─────────────────────────────────────── -->
  <div class="card">
    <div class="card-header">
      <div class="step-badge">1</div>
      <h2>Extract Pages</h2>
    </div>
    <div class="card-body">
      <textarea id="extractUrls" placeholder="https://stripe.com&#10;https://braintree.com&#10;https://adyen.com"></textarea>
      <div class="row">
        <button id="btnExtract">Extract Pages</button>
        <span id="extractSpinner" class="spinner hidden"></span>
      </div>
      <div id="extractLog" class="log"></div>
      <div id="fileList" class="file-list"></div>
      <div id="fileCount" class="file-count hidden"></div>
    </div>
  </div>

  <!-- ── STEP 2: ANALYZE ─────────────────────────────────────── -->
  <div class="card">
    <div class="card-header">
      <div class="step-badge">2</div>
      <h2>Analyze</h2>
    </div>
    <div class="card-body">
      <div class="row" style="margin-top:0">
        <button id="btnAnalyze" disabled>Analyze Selected Files</button>
        <span id="analyzeSpinner" class="spinner hidden"></span>
      </div>

      <div id="phaseBar" class="phase-bar mt8 hidden">
        <div id="phase1" class="phase-pill">① Extraction</div>
        <div id="phase2" class="phase-pill">② Deep Analysis</div>
        <div id="phase3" class="phase-pill">③ Lookalike Profile</div>
      </div>

      <div id="analyzeLog" class="log mt8"></div>

      <div id="analysisOutput" class="analysis-panel mt8"></div>

      <div id="profileCard" class="profile-card hidden"></div>
    </div>
  </div>

  <!-- ── STEP 3: SCORE ────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header">
      <div class="step-badge">3</div>
      <h2>Score Candidate Companies</h2>
    </div>
    <div class="card-body">
      <textarea id="candidateUrls" placeholder="https://candidate1.com&#10;https://candidate2.com"></textarea>
      <div class="row">
        <button id="btnScore" disabled>Score Candidates</button>
        <span id="scoreSpinner" class="spinner hidden"></span>
      </div>
      <div id="scoreLog" class="log"></div>
      <div id="scoreResults"></div>
    </div>
  </div>

</div><!-- /container -->

<script>
// ── Helpers ──────────────────────────────────────────────────────────────

const $ = id => document.getElementById(id);
const apiKey = () => $('apiKey').value.trim();

function logLine(el, text, cls = 'info') {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = text;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function sseStream(url, handlers) {
  const es = new EventSource(url);
  es.onmessage = e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    const handler = handlers[msg.type] || handlers['*'];
    if (handler) handler(msg);
  };
  es.onerror = () => {
    es.close();
    if (handlers.close) handlers.close();
  };
  return es;
}

// ── File chip management ─────────────────────────────────────────────────

let selectedFiles = new Set();

async function refreshFiles() {
  const res = await fetch('/api/files');
  const files = await res.json();
  renderFileChips(files);
}

function renderFileChips(files) {
  const list = $('fileList');
  const count = $('fileCount');
  list.innerHTML = '';

  if (!files.length) {
    count.classList.add('hidden');
    return;
  }

  files.forEach(f => {
    const chip = document.createElement('label');
    chip.className = 'file-chip' + (selectedFiles.has(f.name) ? ' selected' : '');
    chip.innerHTML = `
      <input type="checkbox" ${selectedFiles.has(f.name) ? 'checked' : ''}>
      <span>${f.name.replace('.md','')}</span>
      <span style="color:var(--muted);font-size:11px">${(f.chars/1000).toFixed(0)}k</span>
      <button class="chip-delete" title="Delete" data-name="${f.name}">×</button>
    `;
    chip.addEventListener('change', () => {
      if (chip.querySelector('input').checked) {
        selectedFiles.add(f.name);
        chip.classList.add('selected');
      } else {
        selectedFiles.delete(f.name);
        chip.classList.remove('selected');
      }
      updateAnalyzeBtn();
    });
    chip.querySelector('.chip-delete').addEventListener('click', async ev => {
      ev.preventDefault();
      await fetch(`/api/files/${f.name}`, { method: 'DELETE' });
      selectedFiles.delete(f.name);
      refreshFiles();
      updateAnalyzeBtn();
    });
    list.appendChild(chip);
  });

  count.textContent = `${files.length} file(s) extracted`;
  count.classList.remove('hidden');
  updateAnalyzeBtn();
}

function updateAnalyzeBtn() {
  $('btnAnalyze').disabled = selectedFiles.size === 0;
  $('btnAnalyze').textContent = selectedFiles.size
    ? `Analyze ${selectedFiles.size} Selected File${selectedFiles.size > 1 ? 's' : ''}`
    : 'Analyze Selected Files';
}

// Pre-select all when chips are added
function autoSelectAll() {
  document.querySelectorAll('.file-chip input').forEach(cb => {
    const chip = cb.closest('.file-chip');
    const name = chip.querySelector('.chip-delete').dataset.name;
    cb.checked = true;
    selectedFiles.add(name);
    chip.classList.add('selected');
  });
  updateAnalyzeBtn();
}

// ── Step 1: Extract ───────────────────────────────────────────────────────

$('btnExtract').addEventListener('click', () => {
  const raw = $('extractUrls').value.trim();
  if (!raw) return;
  const urls = raw.split('\n').map(u => u.trim()).filter(Boolean);
  if (!urls.length) return;

  const log = $('extractLog');
  log.innerHTML = '';
  $('btnExtract').disabled = true;
  $('extractSpinner').classList.remove('hidden');

  const query = urls.map(u => encodeURIComponent(u)).join(',');
  let count = 0;

  sseStream(`/api/extract?urls=${query}`, {
    log:  m => logLine(log, m.text, 'info'),
    file: m => {
      count++;
      logLine(log, `✓ ${m.file} (${(m.chars/1000).toFixed(0)}k chars)`, 'ok');
      selectedFiles.add(m.file);
      refreshFiles().then(autoSelectAll);
    },
    error: m => logLine(log, `✗ ${m.text || m.error}`, 'err'),
    done:  () => {
      logLine(log, `Done — ${count} page(s) extracted.`, 'ok');
      $('btnExtract').disabled = false;
      $('extractSpinner').classList.add('hidden');
    },
    close: () => {
      $('btnExtract').disabled = false;
      $('extractSpinner').classList.add('hidden');
    },
  });
});

// ── Step 2: Analyze ──────────────────────────────────────────────────────

let analysisRaw = '';
let renderTimer = null;

function setPhase(n) {
  ['phase1','phase2','phase3'].forEach((id, i) => {
    const el = $(id);
    if (i + 1 < n) el.className = 'phase-pill done';
    else if (i + 1 === n) el.className = 'phase-pill active';
    else el.className = 'phase-pill';
  });
}

function renderAnalysis(streaming) {
  const out = $('analysisOutput');
  if (!analysisRaw) return;
  out.innerHTML = marked.parse(analysisRaw);
  if (streaming) out.classList.add('streaming');
  else out.classList.remove('streaming');
  out.scrollTop = out.scrollHeight;
}

$('btnAnalyze').addEventListener('click', () => {
  if (selectedFiles.size === 0) return;
  const key = apiKey();

  const log = $('analyzeLog');
  log.innerHTML = '';
  $('analysisOutput').innerHTML = '';
  $('profileCard').classList.add('hidden');
  $('profileCard').innerHTML = '';
  analysisRaw = '';

  $('btnAnalyze').disabled = true;
  $('analyzeSpinner').classList.remove('hidden');
  $('phaseBar').classList.remove('hidden');
  setPhase(1);

  const filesParam = [...selectedFiles].map(encodeURIComponent).join(',');
  const keyParam   = key ? `&api_key=${encodeURIComponent(key)}` : '';

  sseStream(`/api/analyze?files=${filesParam}${keyParam}`, {
    phase: m => {
      setPhase(m.n);
      logLine(log, `● Phase ${m.n}: ${m.text}`, 'info');
    },
    log:       m => logLine(log, m.text, 'info'),
    extracted: m => logLine(log, `✓ Extracted: ${m.name || m.file}`, 'ok'),
    analysis:  m => {
      analysisRaw += m.text;
      clearTimeout(renderTimer);
      renderTimer = setTimeout(() => renderAnalysis(true), 80);
    },
    profile: m => {
      setPhase(4);
      renderAnalysis(false);
      renderProfile(m.data);
      $('btnScore').disabled = false;
    },
    error: m => logLine(log, `✗ ${m.text}`, 'err'),
    done: () => {
      renderAnalysis(false);
      $('btnAnalyze').disabled = false;
      $('analyzeSpinner').classList.add('hidden');
      logLine(log, '✓ Analysis complete.', 'ok');
    },
    close: () => {
      $('btnAnalyze').disabled = false;
      $('analyzeSpinner').classList.add('hidden');
    },
  });
});

function renderProfile(p) {
  const card = $('profileCard');
  card.innerHTML = `
    <h3>🎯 Lookalike Profile</h3>
    <div class="profile-name">${p.profile_name || 'Business Profile'}</div>
    <div class="profile-summary">${p.profile_summary || ''}</div>

    ${renderSignalGroup('Must-Have Signals', p.must_have_signals, 'must')}
    ${renderSignalGroup('Strong Signals', p.strong_signals, 'strong')}
    ${renderSignalGroup('Disqualifiers', p.disqualifying_signals, 'disqual')}
    ${renderSignalGroup('Discovery Channels', p.discovery_channels, 'channel')}

    ${p.company_size_range ? `
      <div class="signal-group">
        <div class="signal-group-label">Company Size</div>
        <div style="font-size:13px;color:var(--text)">
          ${p.company_size_range.employees_min || ''}–${p.company_size_range.employees_max || ''} employees
          &nbsp;·&nbsp;
          ${p.company_size_range.revenue_min || ''} – ${p.company_size_range.revenue_max || ''} ARR
        </div>
      </div>
    ` : ''}
  `;
  card.classList.remove('hidden');
}

function renderSignalGroup(label, items, cls) {
  if (!items || !items.length) return '';
  return `
    <div class="signal-group">
      <div class="signal-group-label">${label}</div>
      <div class="signal-tags">
        ${items.slice(0, 8).map(s => `<span class="signal-tag ${cls}">${escHtml(s)}</span>`).join('')}
        ${items.length > 8 ? `<span class="signal-tag ${cls}">+${items.length-8} more</span>` : ''}
      </div>
    </div>
  `;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Step 3: Score ────────────────────────────────────────────────────────

$('btnScore').addEventListener('click', () => {
  const raw = $('candidateUrls').value.trim();
  if (!raw) return;
  const urls = raw.split('\n').map(u => u.trim()).filter(Boolean);
  const key = apiKey();

  const log = $('scoreLog');
  log.innerHTML = '';
  $('scoreResults').innerHTML = '';

  $('btnScore').disabled = true;
  $('scoreSpinner').classList.remove('hidden');

  const query  = urls.map(u => encodeURIComponent(u)).join(',');
  const keyParam = key ? `&api_key=${encodeURIComponent(key)}` : '';

  let scores = [];

  sseStream(`/api/score?urls=${query}${keyParam}`, {
    log:   m => logLine(log, m.text, 'info'),
    score: m => {
      scores.push(m.data);
      scores.sort((a,b) => (b.overall_score||0) - (a.overall_score||0));
      renderScores(scores);
    },
    scores_done: m => renderScores(m.data),
    error: m => logLine(log, `✗ ${m.text || m.error}`, 'err'),
    done: () => {
      $('btnScore').disabled = false;
      $('scoreSpinner').classList.add('hidden');
      logLine(log, `✓ Scoring complete.`, 'ok');
    },
    close: () => {
      $('btnScore').disabled = false;
      $('scoreSpinner').classList.add('hidden');
    },
  });
});

function verdictClass(v) {
  if (!v) return '';
  if (v.includes('strong')) return 'strong';
  if (v.includes('moderate')) return 'moderate';
  return 'weak';
}

function scoreClass(n) {
  if (n >= 70) return 'high';
  if (n >= 40) return 'medium';
  return 'low';
}

function renderScores(scores) {
  const el = $('scoreResults');
  if (!scores.length) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <table class="score-table">
      <thead>
        <tr>
          <th>Score</th>
          <th>URL</th>
          <th>Verdict</th>
          <th>Top Similarities</th>
        </tr>
      </thead>
      <tbody>
        ${scores.map(s => `
          <tr>
            <td>
              <div class="score-badge ${scoreClass(s.overall_score || 0)}">${s.overall_score || '?'}</div>
            </td>
            <td style="font-family:monospace;font-size:12px;max-width:200px;word-break:break-all">
              ${escHtml(s.url || s.company_name || '')}
            </td>
            <td><span class="verdict ${verdictClass(s.verdict)}">${escHtml(s.verdict || '')}</span></td>
            <td>
              <ul class="similarities">
                ${(s.top_similarities || []).slice(0,3).map(x => `<li>${escHtml(x)}</li>`).join('')}
              </ul>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

// ── Init ─────────────────────────────────────────────────────────────────
refreshFiles();
</script>
</body>
</html>
